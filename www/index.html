/* ===== CAMPFIRE SCENE ===== */
.campfire-scene {
  flex: 1;
  min-width: 320px;
  min-height: 560px;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--bg);
  image-rendering: pixelated;
}

.cf-sky {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, #0a0d10 0%, #11140f 55%, #181a12 100%);
  transition: background 1.1s linear;
}
.cf-stars {
  position: absolute;
  inset: 0;
  opacity: 0.75;
  transition: opacity 1.1s linear;
}
.cf-stars-twinkle {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 8% 15%, var(--bone-dim) 50%, transparent 51%),
    radial-gradient(1px 1px at 22% 8%, var(--bone-dim) 50%, transparent 51%),
    radial-gradient(1px 1px at 38% 22%, var(--bone) 50%, transparent 51%),
    radial-gradient(1px 1px at 55% 6%, var(--bone-dim) 50%, transparent 51%),
    radial-gradient(1px 1px at 68% 18%, var(--bone) 50%, transparent 51%),
    radial-gradient(1px 1px at 81% 10%, var(--bone-dim) 50%, transparent 51%),
    radial-gradient(1px 1px at 92% 25%, var(--bone-dim) 50%, transparent 51%),
    radial-gradient(1px 1px at 14% 32%, var(--bone-dim) 50%, transparent 51%),
    radial-gradient(1px 1px at 47% 14%, var(--bone) 50%, transparent 51%),
    radial-gradient(1px 1px at 73% 30%, var(--bone-dim) 50%, transparent 51%);
  opacity: 0.8;
  animation: cfTwinkle 4s ease-in-out infinite;
}
@keyframes cfTwinkle { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

.cf-sky-tint {
  position: absolute;
  inset: 0;
  mix-blend-mode: multiply;
  transition: background 1.1s linear;
}

.cf-ground {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 38%;
  background: linear-gradient(to bottom, #1a1c13 0%, #111209 60%, #0d0e08 100%);
  border-top: 2px solid rgba(120,220,80,0.08);
  transition: background 1.1s linear;
}
.cf-ground::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(90deg, rgba(120,220,80,0.04) 0 1px, transparent 1px 48px),
    repeating-linear-gradient(0deg, rgba(120,220,80,0.04) 0 1px, transparent 1px 32px);
}
.cf-ground::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 60%);
}

.cf-landscape {
  position: absolute;
  left: 0; right: 0;
  bottom: 33%;
  height: 22%;
  pointer-events: none;
  z-index: 2;
  opacity: 0.85;
}
.cf-explosion-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  overflow: hidden;
}

.cf-buildings {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4; /* above landscape (2) and explosions (3) so buildings and their popups sit in front of the skyline */
}
.cf-chest-layer,
.cf-warehouse-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
}
.cf-building {
  position: absolute;
  pointer-events: auto;
  cursor: pointer;
  transform-origin: 50% 100%;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,0.5));
}
.cf-building svg {
  width: 100px;
  height: auto;
  display: block;
  shape-rendering: crispEdges;
}
/* Unbuilt dimming applies to the building SVG only, NOT the whole div —
   putting opacity/brightness on the parent would cascade down into the
   hover popup and wash it out against the dark skyline. Targeting the
   svg keeps the ghost look on the building while leaving the popup at
   full strength. */
.cf-building.unbuilt svg {
  opacity: 0.55;
  filter: grayscale(1) brightness(0.5) drop-shadow(0 0 4px rgba(120,220,80,0.5)) drop-shadow(0 3px 4px rgba(0,0,0,0.5));
}
.cf-building.unbuilt:hover svg {
  opacity: 0.8;
  filter: grayscale(0.8) brightness(0.7) drop-shadow(0 0 8px rgba(120,220,80,0.8)) drop-shadow(0 3px 4px rgba(0,0,0,0.5));
}
.cf-chest svg { width: 78px; }
.cf-chest:hover { filter: drop-shadow(0 3px 4px rgba(0,0,0,0.5)) drop-shadow(0 0 6px rgba(194,169,79,0.4)); }
.cf-warehouse { cursor: default; } /* hover-only readout, nothing to click */
.cf-warehouse svg { width: 104px; }
.cf-warehouse-supplies {
  display: flex;
  flex-direction: column;
  gap: 1px;
  margin-bottom: 2px;
}
.cf-supply-line {
  font-weight: 600;
  font-size: 8px;
}
.cf-supply-line.scrap { color: var(--gunmetal-bright); }
.cf-supply-line.gold { color: var(--brass-bright); }
.cf-supply-line.meds { color: var(--rust-bright); }
.cf-supply-line.food { color: var(--olive-bright); }
.cf-supply-line.intel { color: var(--accent-blue-bright); }
.cf-supply-line.upkeep {
  color: var(--rust-bright);
  border-top: 1px solid var(--rust);
  margin-top: 2px;
  padding-top: 2px;
}
.cf-building-label {
  position: absolute;
  bottom: 100%;
  left: 50%;
  /* Counter-scale by the inverse of the building's own scale so every
     popup renders at the same visual size regardless of how large or
     small its building is drawn (radio tower is 0.72, barracks 1.44). */
  transform: translateX(-50%) scale(calc(1 / var(--bscale, 1)));
  transform-origin: bottom center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  margin-bottom: 9px;
  font-family: var(--font-mono);
  font-size: 9px;
  white-space: normal;
  max-width: 150px;
  text-align: center;
  opacity: 0;
  transition: opacity 0.12s;
  pointer-events: none;
  z-index: 40;
}
/* Shared tooltip surface for name + level so both read cleanly against
   the dark scene. Fully opaque, with a strong halo shadow so it reads as
   a floating label and never blends into a building behind it. BUILT
   buildings get a green border; UNBUILT get a solid gray box (see below). */
.cf-building-name,
.cf-building-level,
.cf-supply-line {
  background: #2b3324;
  border: 2px solid var(--brass-bright);
  box-shadow: 0 0 0 3px #050704, 0 4px 14px rgba(0,0,0,0.95);
  padding: 4px 8px;
  line-height: 1.3;
}
.cf-building-name {
  color: var(--bone);
  font-weight: 600;
  letter-spacing: 0.5px;
}
.cf-building-level {
  color: var(--brass-bright);
  font-weight: 600;
  font-size: 8px;
}
.cf-building-level.maxed { color: var(--olive-bright); border-color: var(--olive-bright); }
/* Unbuilt: solid gray box, clearly distinct from the green built popups */
.cf-building.unbuilt .cf-building-name,
.cf-building.unbuilt .cf-building-level {
  background: #33362f;
  border-color: #7a7f72;
  color: #d4d8cc;
}
.cf-building:hover .cf-building-label { opacity: 1; }
/* Unlike survivors (no tap alternative — see the survivor-label hover:none
   rule below), every building already opens a full info popup on tap. On
   a real touch device this "always show the hover label" rule meant EVERY
   building's name+level tag rendered at once, all the time, all stacked
   on top of each other in a scene that's already compact on a phone —
   the actual cause of the camp screen looking "jumbled." Tapping still
   gives full detail via the popup, so the ambient label can just stay
   hidden here instead of trying to replicate hover on a device with no
   hover concept. */
@media (hover: none) {
  .cf-building-label { opacity: 0; }
}

.cf-clock {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 7;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 9px;
  background: rgba(5,6,4,0.78);
  border: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 7.2px;
  color: var(--bone-dim);
}
.cf-clock-icon { flex-shrink: 0; color: var(--bone-dim); transition: color 0.6s linear; }
.cf-clock-time { color: var(--bone); font-weight: 600; }
.cf-clock-day { color: var(--brass-bright); letter-spacing: 0.5px; }
/* Accent color follows the current phase — same data attribute
   applyDayNightLighting() updates every tick, just a CSS lookup rather
   than another inline style to juggle. */
.cf-clock[data-phase="dawn"] .cf-clock-icon, .cf-clock[data-phase="dusk"] .cf-clock-icon { color: var(--rust-bright); }
.cf-clock[data-phase="day"] .cf-clock-icon { color: var(--brass-bright); }
.cf-clock[data-phase="night"] .cf-clock-icon { color: var(--gunmetal-bright); }

.cf-clock-weather-glyph {
  display: flex;
  color: var(--bone-dim);
}
.cf-clock-weather-glyph svg { display: block; }
/* Positioned below the clock badge, not above — .cf-clock sits near the
   top of the scene (top: 10px), so a panel anchored above it the way
   building/survivor labels float above THEM would push off the top of
   the visible scene entirely instead of actually being visible. */
.cf-forecast-panel {
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 6px;
  width: 220px;
  background: rgba(5,6,4,0.94);
  border: 1px solid var(--border);
  padding: 8px 10px;
  font-family: var(--font-mono);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
  z-index: 8;
}
.cf-clock:hover .cf-forecast-panel { opacity: 1; }
@media (hover: none) {
  .cf-forecast-panel { opacity: 0.95; }
}
.forecast-row { padding: 4px 0; }
.forecast-row + .forecast-row { border-top: 1px solid var(--border); }
.forecast-label {
  font-size: 6px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--bone-dim);
}
.forecast-name {
  font-size: 7.2px;
  font-weight: 600;
  color: var(--brass-bright);
  font-family: var(--font-display);
  letter-spacing: 0.5px;
}
.forecast-effect {
  font-size: 6.1px;
  color: var(--bone-dim);
  margin-top: 1px;
}


.cf-glow {
  position: absolute;
  left: 50%;
  bottom: 27%;
  width: 280px;
  height: 280px;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(212,80,47,0.30) 0%, rgba(212,80,47,0.12) 35%, transparent 70%);
  animation: cfGlowPulse 2.6s ease-in-out infinite;
  pointer-events: none;
  z-index: 3; /* firelight glow sits behind buildings, above landscape/explosions */
}
@keyframes cfGlowPulse { 0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(0.94); } 50% { opacity: 1; transform: translateX(-50%) scale(1.05); } }

.cf-fire {
  position: absolute;
  left: 50%;
  bottom: 27%;
  transform: translateX(-50%);
  width: 50px;
  height: 56px;
  z-index: 5; /* fire in front of buildings */
}
.cf-fire-svg { width: 100%; height: 100%; display: block; }
.cf-flame-outer, .cf-flame-mid, .cf-flame-inner {
  transform-box: fill-box;
  transform-origin: 50% 100%;
}
.cf-flame-outer { animation: cfFlameA 0.9s steps(2) infinite; }
.cf-flame-mid { animation: cfFlameB 0.7s steps(2) infinite reverse; }
.cf-flame-inner { animation: cfFlameB 0.6s steps(2) infinite; }
@keyframes cfFlameA { 0% { transform: scaleY(1) scaleX(1); } 50% { transform: scaleY(1.08) scaleX(0.92); } 100% { transform: scaleY(1) scaleX(1); } }
@keyframes cfFlameB { 0% { transform: scaleY(0.95) scaleX(1.05); } 50% { transform: scaleY(1.1) scaleX(0.9); } 100% { transform: scaleY(0.95) scaleX(1.05); } }
/* Weather/day-night reactivity — applyDayNightLighting sets these data
   attributes on .cf-fire once per tick based on getCurrentWeather()/
   getDayPhase(), and CSS reacts to them rather than JS touching style
   properties directly. Rain/Storm dampen the fire (smaller, dimmer,
   slightly desaturated) since a real fire would struggle in either;
   night brightens the glow specifically (not the flame itself, which
   stays the same size) since the same fire reads as more vivid against
   a dark sky than a bright one without actually being a different fire. */
.cf-fire[data-weather="rain"] .cf-fire-svg,
.cf-fire[data-weather="storm"] .cf-fire-svg {
  transform: scale(0.82);
  filter: saturate(0.7) brightness(0.85);
}
.cf-fire[data-weather="storm"] .cf-flame-outer,
.cf-fire[data-weather="storm"] .cf-flame-mid,
.cf-fire[data-weather="storm"] .cf-flame-inner {
  animation-duration: 0.35s; /* flickers harder in a storm than its normal steady burn */
}
.cf-glow[data-phase="night"], .cf-glow[data-phase="dusk"] {
  width: 320px;
  height: 320px;
}

.cf-embers {
  position: absolute;
  left: 50%;
  bottom: 31%;
  width: 2px;
  height: 2px;
  transform: translateX(-50%);
  z-index: 5;
}
.cf-ember {
  position: absolute;
  width: 2px;
  height: 2px;
  background: var(--brass-bright);
  opacity: 0;
  animation: cfEmberRise 2.4s linear infinite;
}
.cf-ember:nth-child(1) { left: -6px; animation-delay: 0s; --drift: -8px; }
.cf-ember:nth-child(2) { left: 2px; animation-delay: 0.8s; --drift: 5px; }
.cf-ember:nth-child(3) { left: -2px; animation-delay: 1.6s; --drift: -3px; }
@keyframes cfEmberRise {
  0% { opacity: 0; transform: translate(0, 0); }
  10% { opacity: 1; }
  90% { opacity: 0.4; }
  100% { opacity: 0; transform: translate(var(--drift, 6px), -70px); }
}

.cf-weather-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 6;
}
.cf-weather-overlay[data-weather="clear"] { opacity: 0; }
.cf-weather-overlay[data-weather="overcast"] {
  background: rgba(60, 65, 70, 0.13);
}
.cf-weather-overlay[data-weather="fog"] {
  background: linear-gradient(
    to top,
    rgba(180,185,180,0.38) 0%,
    rgba(160,165,160,0.18) 40%,
    transparent 70%
  );
  animation: cfFogDrift 8s ease-in-out infinite alternate;
}
@keyframes cfFogDrift {
  0% { opacity: 0.7; transform: scaleX(1); }
  100% { opacity: 1; transform: scaleX(1.04); }
}
.cf-weather-overlay[data-weather="rain"],
.cf-weather-overlay[data-weather="storm"] {
  background-image: repeating-linear-gradient(
    105deg,
    transparent 0px,
    transparent 6px,
    rgba(160,180,200,0.18) 6px,
    rgba(160,180,200,0.18) 7px
  );
  background-size: 20px 20px;
  animation: cfRainFall 0.55s linear infinite;
}
.cf-weather-overlay[data-weather="storm"] {
  background-image: repeating-linear-gradient(
    105deg,
    transparent 0px,
    transparent 4px,
    rgba(140,165,190,0.28) 4px,
    rgba(140,165,190,0.28) 5px
  );
  background-size: 14px 14px;
  animation: cfRainFall 0.32s linear infinite;
  box-shadow: inset 0 0 0 9999px rgba(30,38,50,0.22);
}
@keyframes cfRainFall {
  0% { background-position: 0 0; }
  100% { background-position: -20px 40px; }
}

.cf-survivors {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 6; /* scavs in the foreground, above buildings and fire */
}
.cf-survivor {
  position: absolute;
  width: 50px;
  height: 94px;
  cursor: pointer;
  pointer-events: auto;
}
.cf-survivor-pose {
  width: 100%;
  height: 100%;
  transform-origin: 50% 100%;
  animation: cfBob var(--bob-dur, 2.4s) ease-in-out infinite;
  animation-delay: var(--bob-delay, 0s);
}
.cf-survivor-pose.facing-left { transform: scaleX(-1); }
.cf-survivor-pose.walking { animation: cfWalkBob 0.45s ease-in-out infinite; }
.cf-survivor-pose.seated {
  animation: cfSeatedSway 3.2s ease-in-out infinite;
  animation-delay: var(--bob-delay, 0s);
}
/* Hide standing legs and shoes when seated, show the cross-legged
   seated geometry drawn in survivorSvgMarkup instead. Visibility swap
   beats trying to CSS-transform a 4×8 rect into a convincing knee. */
.cf-survivor-pose.seated .cf-leg-a,
.cf-survivor-pose.seated .cf-leg-b { display: none; }
.cf-seated-lap { display: none; }
.cf-survivor-pose.seated .cf-seated-lap { display: block; }
@keyframes cfSeatedSway {
  0%, 100% { transform: translateY(2px) rotate(0deg); }
  50% { transform: translateY(1px) rotate(0.6deg); }
}
@keyframes cfBob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}
@keyframes cfWalkBob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-1.5px); }
}
.cf-survivor-pose svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
.cf-leg { transform-box: fill-box; transform-origin: 50% 0%; }

/* Buildings, the chest, the warehouse, and survivors are all sized in
   fixed pixels, positioned with percentage-based left/bottom offsets
   that already shrink to fit a narrower scene on their own — only the
   sprite sizes themselves don't. At the scene's actual phone-width floor
   (420px, see .campfire-scene's 840px breakpoint above), 7 buildings at
   their full 100px width would visibly overlap; scaling every sprite
   down here keeps the same scene readable without touching a single
   position value. */
@media (max-width: 840px), (max-height: 500px) {
  .cf-building svg { width: 64px; }
  .cf-chest svg { width: 52px; }
  .cf-warehouse svg { width: 70px; }
  .cf-survivor { width: 34px; height: 64px; }
}
.cf-survivor-pose.walking .cf-leg-a { animation: cfLegA 0.45s ease-in-out infinite; }
.cf-survivor-pose.walking .cf-leg-b { animation: cfLegB 0.45s ease-in-out infinite; }
@keyframes cfLegA { 0%, 100% { transform: rotate(22deg); } 50% { transform: rotate(-22deg); } }
@keyframes cfLegB { 0%, 100% { transform: rotate(-22deg); } 50% { transform: rotate(22deg); } }
.cf-survivor-label {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  margin-bottom: 4px;
  font-family: var(--font-mono);
  font-size: 6.1px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.15s;
  pointer-events: none;
}
.cf-chat-bubble {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-panel-raised);
  border: 1px solid var(--brass);
  color: var(--bone);
  font-family: var(--font-mono);
  font-size: 6px;
  line-height: 1.35;
  padding: 5px 8px;
  white-space: normal;
  width: 140px;
  text-align: center;
  pointer-events: none;
  z-index: 20;
  animation: cfChatFadeIn 0.25s ease;
}
.cf-chat-bubble::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--brass);
}
.cf-chat-bubble::before {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-top: 1px;
  border: 4px solid transparent;
  border-top-color: var(--bg-panel-raised);
  z-index: 1;
}
@keyframes cfChatFadeIn {
  from { opacity: 0; transform: translateX(-50%) translateY(4px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.cf-survivor-hp {
  color: var(--rust-bright);
  background: rgba(5,6,4,0.9);
  padding: 1px 4px;
  border: 1px solid var(--rust);
  font-weight: 600;
}
.cf-survivor-hp.healthy { color: var(--olive-bright); border-color: var(--olive); }
.cf-survivor-hp.mid { color: var(--brass-bright); border-color: var(--brass); }
.cf-survivor-name {
  color: var(--bone-dim);
  background: rgba(5,6,4,0.85);
  padding: 1px 4px;
  border: 1px solid var(--border);
}
.cf-survivor:hover .cf-survivor-label { opacity: 1; }
/* On a touch-only device, :hover never fires at all — without this,
   a survivor's name and HP would be permanently invisible on Android/
   mobile, since there's no tap handler on the sprite to reveal it any
   other way (unlike the buildings, where tapping opens the full popup
   regardless). @media (hover: none) targets "this device has no real
   hover," which is the actual thing that matters here — more reliable
   than guessing from screen width, since plenty of laptops have
   touchscreens too and plenty of phones get docked to a mouse. */
@media (hover: none) {
  .cf-survivor-label { opacity: 0.85; }
}

.cf-empty-note {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--bone-dim);
  font-size: 7.2px;
  font-style: italic;
  text-align: center;
  padding: 30px;
}

/* Below the desktop app's 1000px window floor, the panel column keeps its
   place on the left and the camp scene keeps its place on the right —
   same arrangement as desktop — just narrower, so both still fit
   side-by-side on a phone screen instead of the scene getting hidden or
   pushed below a scroll. The mobile stash button stays as an easy-to-tap
   fallback alongside the scene's own stash chest, since that building is
   necessarily small at this width. */
@media (max-width: 1000px) {
  .left-stack { width: 280px; }
  .campfire-scene { min-width: 200px; }
}

@media (max-width: 600px) {
  .left-stack { width: 220px; }
  .campfire-scene { min-width: 160px; }
}

/* Phones in landscape are typically short (350-450px tall) as well as
   narrow. Shrinking the scene's minimum height here (alongside the sprite
   downscaling above) keeps the amount of scrolling needed to reach it
   reasonable instead of demanding 560px of height on a ~400px screen. */
@media (max-height: 500px) {
  .campfire-scene { min-height: 280px; }
  /* .raid-launcher-card's 40px top/bottom padding (designed for a roomy
     desktop column) is the single biggest thing forcing the whole camp
     screen taller than a phone's landscape height — the actual content
     (one line of status text, one button) barely needs a fraction of
     that. Compacting it here is what lets the roster/raid panels and the
     scene actually fit within one phone screen instead of scrolling. */
  .raid-launcher-card { padding: 14px 16px; }
  .raid-launcher-card .rl-status { margin-bottom: 8px; }
  .left-stack { gap: 8px; }
  .panel-body { padding: 8px; }
}

/* ===== SKILL TREE (per scav) ===== */
.skill-tree-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 160;
  display: flex;
  flex-direction: column;
  animation: raidScreenIn 0.25s ease;
}
.skill-tree-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  overscroll-behavior: contain;
}
.stats-screen-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  max-width: 640px;
}
.stats-summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.stats-resources-grid { grid-template-columns: repeat(4, 1fr); }
.stats-summary-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  border: 1px solid var(--border);
  background: var(--bg-panel-raised);
  padding: 12px 6px;
}
.stats-summary-item .ss-val {
  font-family: var(--font-display);
  font-size: 11.7px;
  color: var(--brass-bright);
}
.stats-summary-item .ss-val.scrap { color: var(--gunmetal-bright); }
.stats-summary-item .ss-val.gold { color: var(--brass-bright); }
.stats-summary-item .ss-val.meds { color: var(--rust-bright); }
.stats-summary-item .ss-val.food { color: var(--olive-bright); }
.stats-summary-item .ss-lbl {
  font-size: 6.1px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--bone-dim);
}
.stats-boss-list { border: 1px solid var(--border); }
.stats-boss-row {
  display: grid;
  grid-template-columns: 1.4fr 1.4fr 0.5fr;
  gap: 8px;
  padding: 7px 10px;
  font-size: 7.2px;
  border-bottom: 1px solid var(--border);
}
.stats-boss-row:last-child { border-bottom: none; }
.stats-boss-row.stats-boss-header {
  background: var(--bg-panel-raised);
  color: var(--bone-dim);
  font-size: 6px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.stats-boss-row.stats-boss-row-zero { color: var(--bone-dim); opacity: 0.6; }
.stats-boss-name { font-weight: 600; }
.stats-boss-map { color: var(--bone-dim); }
.stats-boss-kills { text-align: center; font-weight: 700; color: var(--brass-bright); }
.stats-boss-row.stats-boss-row-zero .stats-boss-kills { color: var(--bone-dim); }
.stats-boss-row.stats-boss-header .stats-boss-kills { color: var(--bone-dim); font-weight: 400; }
.skill-tree-header-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.skill-tree-points {
  font-family: var(--font-display);
  font-size: 8.5px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--bone);
}
.skill-tree-points b { color: var(--brass-bright); font-size: 9px; }
.skill-tree-hint { font-size: 7.4px; color: var(--bone-dim); }

.skill-web-layout {
  display: flex;
  gap: 24px;
  align-items: flex-start;
}
.skill-web-clip {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  /* Fixed height so the clip region is well-defined for pan/zoom */
  height: 70vh;
  position: relative;
  cursor: grab;
}
.skill-web-canvas {
  flex: 1;
  min-width: 0;
  cursor: grab;
  user-select: none;
  will-change: transform;
  /* Transform origin is set to 0 0 in JS so zoom aims at the cursor */
}
.skill-web-svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}
.skill-web-line {
  stroke: var(--border);
  stroke-width: 3;
  transition: stroke 0.15s;
}
.skill-web-line.learned { stroke: var(--olive-bright); }
.skill-web-hub {
  fill: var(--bg-panel-raised);
  stroke: var(--brass);
  stroke-width: 2;
}
.skill-web-hub-label {
  font-family: var(--font-display);
  font-size: 8.5px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  fill: var(--bone);
}
.skill-web-branch-label {
  font-family: var(--font-display);
  font-size: 8.5px;
  letter-spacing: 2px;
  text-transform: uppercase;
  fill: var(--brass-bright);
}
.skill-web-node { cursor: pointer; }
.skill-web-node-circle {
  fill: var(--bg-panel-raised);
  stroke: var(--gunmetal-bright);
  stroke-width: 2.5;
  transition: stroke 0.15s, fill 0.15s;
}
.skill-web-node-rank {
  font-family: var(--font-mono);
  font-size: 7.5px;
  fill: var(--bone-dim);
  text-anchor: middle;
  pointer-events: none;
}
.skill-web-node:hover .skill-web-node-circle { stroke: var(--bone); }
.skill-web-node.locked .skill-web-node-circle { opacity: 0.4; }
.skill-web-node.locked .skill-web-node-rank { opacity: 0.4; }
.skill-web-node.learned .skill-web-node-circle { stroke: var(--olive-bright); }
.skill-web-node.learned .skill-web-node-rank { fill: var(--olive-bright); }
.skill-web-node.maxed .skill-web-node-circle { stroke: var(--brass-bright); fill: #1F1C12; }
.skill-web-node.maxed .skill-web-node-rank { fill: var(--brass-bright); }
.skill-web-node.selected .skill-web-node-circle { stroke-width: 4; filter: drop-shadow(0 0 5px rgba(194,169,79,0.5)); }

.skill-detail-panel {
  flex-shrink: 0;
  width: 240px;
  position: sticky;
  top: 0;
}
.skill-detail-empty {
  font-size: 7px;
  color: var(--bone-dim);
  font-style: italic;
  border: 1px solid var(--border);
  background: var(--bg-panel-raised);
  padding: 14px;
}
.skill-detail {
  border: 1px solid var(--gunmetal-bright);
  background: var(--bg-panel-raised);
  padding: 14px;
  transition: border-color 0.15s;
}
.skill-detail.locked { border-color: var(--border); }
.skill-detail.learned { border-color: var(--olive-bright); }
.skill-detail.maxed { border-color: var(--brass-bright); background: #1F1C12; }
.skill-detail-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.skill-detail-name {
  font-family: var(--font-display);
  font-size: 8.5px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--bone);
}
.skill-detail-rank { font-size: 7px; font-family: var(--font-mono); color: var(--bone-dim); flex-shrink: 0; }
.skill-detail.learned .skill-detail-rank, .skill-detail.maxed .skill-detail-rank { color: var(--brass-bright); }
.skill-detail-branch { font-size: 6.6px; letter-spacing: 1px; text-transform: uppercase; color: var(--brass-bright); margin-top: 3px; }
.skill-detail-effect { font-size: 7.2px; color: var(--bone-dim); margin-top: 10px; line-height: 1.4; }
.skill-detail.learned .skill-detail-effect { color: var(--olive-bright); }
.skill-detail-lock { font-size: 6.9px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--rust-bright); margin-top: 8px; }
.skill-detail-next { font-size: 7.2px; color: var(--bone-dim); margin-top: 8px; font-style: italic; }
.skill-learn-btn { margin-top: 12px; width: 100%; }

@media (max-width: 1000px) {
  .skill-web-layout { flex-direction: column; }
  .skill-detail-panel { width: 100%; position: static; }
}

.char-skills-btn { width: 100%; }

.skill-point-badge {
  display: inline-block;
  font-size: 6.3px;
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--bg);
  background: var(--brass-bright);
  padding: 1px 5px;
  margin-left: 5px;
  border-radius: 2px;
  vertical-align: middle;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

@media (max-width: 600px) {
  .header-stats { gap: 12px; }
}
</style>
</head>
<body>
<!-- SVG filter for CRT noise/grain — invisible element, referenced by
     body { filter: url(#crt-noise) } to add film grain across everything -->
<svg id="crt-noise-filter" style="position:fixed;width:0;height:0;pointer-events:none;">
  <defs>
    <filter id="crt-noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply" result="blended"/>
      <feComponentTransfer in="blended">
        <feFuncR type="linear" slope="1.05"/>
        <feFuncG type="linear" slope="1.1"/>
        <feFuncB type="linear" slope="0.9"/>
      </feComponentTransfer>
    </filter>
  </defs>
</svg>
<div class="app" id="app">Loading outpost…</div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="game.js"></script>
<script>
  // Registered after game.js loads, not before — the service worker
  // caching the app shell has nothing to do with the game actually
  // starting up, and there's no reason to make the very first paint
  // wait on it. Guarded by a feature check since some older/embedded
  // WebViews don't support service workers at all; the game still works
  // fine without one, just without the offline-install benefit.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => {
        console.error("Service worker registration failed:", err);
      });
    });
  }
</script>

</body>
